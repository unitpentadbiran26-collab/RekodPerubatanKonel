<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuntutan Perubatan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5a54">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuntutan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f5f4; --kad:#ffffff; --teks:#14211f; --lembut:#64748b; --garis:#e3e9e7;
    --utama:#0f766e; --utama-gelap:#0b5a54; --utama-cair:#e3f3f0; --baki:#cde8e2;
    --amber:#b45309; --amber-terang:#f59e0b; --amber-cair:#fef3c7;
    --merah:#c2410c; --merah-cair:#fde8dd; --hijau:#15803d; --hijau-cair:#dcfce7;
    --biru:#0369a1; --biru-cair:#e0f2fe;
    --bayang:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--teks);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--utama)}

  /* ---------- Bar atas ---------- */
  .bar{background:linear-gradient(120deg,#0a4f4a,#0f766e 60%,#14917f);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  .jenama{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
  .logo img{width:100%;height:100%;object-fit:contain}
  .logo.tiada::after{content:"✚";color:var(--utama);font-weight:800}
  .logo-kecil{width:38px;height:38px;border-radius:11px;padding:3px}
  .logo-kecil.tiada::after{font-size:20px}
  .jenama b{display:block;font-size:15px;line-height:1.2;white-space:nowrap}
  .jenama small{display:block;font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-aksi{display:flex;gap:6px;flex:none}
  .ikon-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;height:36px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .ikon-btn:hover{background:rgba(255,255,255,.25)}
  .ikon-btn svg{width:17px;height:17px}
  @media(max-width:520px){.ikon-btn span{display:none}.ikon-btn{padding:0 9px}}

  main{max-width:940px;margin:0 auto;padding:18px 16px 70px}
  .kad{background:var(--kad);border-radius:18px;box-shadow:var(--bayang);padding:20px;margin-bottom:16px}
  h1{font-size:21px;margin:0 0 2px;letter-spacing:-.2px} h2{font-size:15.5px;margin:0 0 14px;letter-spacing:-.1px}
  .kecil{color:var(--lembut);font-size:13px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--garis);border-radius:11px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:3px solid var(--utama-cair);border-color:var(--utama)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer;transition:background .15s,transform .05s}
  .btn:active{transform:translateY(1px)}
  .btn-utama{background:var(--utama);color:#fff} .btn-utama:hover{background:var(--utama-gelap)}
  .btn-garis{background:#fff;border:1px solid var(--garis);color:var(--teks)}
  .btn-merah{background:var(--merah);color:#fff}
  .btn-penuh{width:100%}
  .btn:disabled{opacity:.6;cursor:wait}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  .atas{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .muncul{animation:muncul .35s ease both}
  @keyframes muncul{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Log masuk ---------- */
  .skrin-login{min-height:calc(100vh - 140px);display:grid;place-items:center}
  .kad-login{width:100%;max-width:400px;padding:32px 24px 26px}
  .kad-login .kepala{text-align:center;margin-bottom:8px}
  .logo-besar{width:96px;height:96px;border-radius:26px;margin:0 auto 14px;padding:8px;box-shadow:0 6px 20px rgba(15,118,110,.18);border:1px solid var(--garis)}
  .logo-besar.tiada::after{font-size:46px}
  .medan{position:relative}
  .medan .ik{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#94a3b8;pointer-events:none}
  .medan input{padding-left:40px}
  .medan .lihat{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:#94a3b8;display:grid}
  .medan .lihat svg{width:19px;height:19px}
  .nota-login{text-align:center;margin-top:16px}
  .peraturan{list-style:none;padding:0;margin:10px 0 0;font-size:13px;color:var(--lembut)}
  .peraturan li{padding:2px 0} .peraturan li.ok{color:var(--hijau)} .peraturan li::before{content:"○ "} .peraturan li.ok::before{content:"✓ "}

  /* ---------- Papan pemuka ---------- */
  .salam{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--utama-cair);color:var(--utama);display:grid;place-items:center;font-weight:800;flex:none}
  .salam .isi{flex:1;min-width:0}
  .salam h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .salam select{width:auto;padding:8px 10px}

  .hero{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
  @media(max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
  .donut{position:relative;width:100%;max-width:220px;aspect-ratio:1}
  .donut svg{width:100%;height:100%;display:block}
  .donut .tengah{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .donut .tengah small{font-size:12px;color:var(--lembut);font-weight:600}
  .donut .tengah b{font-size:22px;line-height:1.15;color:var(--utama);letter-spacing:-.4px}
  .donut .tengah span{font-size:12px;color:var(--lembut)}
  .donut-kecil{max-width:170px}
  .donut-kecil .tengah b{font-size:17px;color:var(--teks)}
  .lengkung{transition:stroke-dasharray .8s ease}
  .legenda{display:grid;gap:10px;width:100%}
  .legenda .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
  .legenda .titik{width:11px;height:11px;border-radius:4px;flex:none}
  .legenda .lbl{flex:1;font-size:13.5px;text-align:left}
  .legenda .nilai{font-weight:700;font-size:14px}
  .legenda .pc{font-size:12px;color:var(--lembut);min-width:38px;text-align:right}
  .legenda-kecil .item{padding:6px 8px;background:none;border-bottom:1px dashed var(--garis);border-radius:0}
  .legenda-kecil .item:last-child{border-bottom:0}
  .hero-tajuk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  @media(max-width:640px){.hero-tajuk{justify-content:center}}

  .statusgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:640px){.statusgrid{grid-template-columns:1fr 1fr}}
  .stat{background:var(--kad);border-radius:16px;box-shadow:var(--bayang);padding:14px 16px;display:flex;align-items:center;gap:12px}
  .stat .ikon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
  .stat .ikon svg{width:20px;height:20px}
  .stat b{display:block;font-size:20px;line-height:1.1}
  .stat span{font-size:12.5px;color:var(--lembut)}

  .carta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .carta-grid .kad{margin:0}
  @media(max-width:760px){.carta-grid{grid-template-columns:1fr}}
  .jenis-wrap{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center}
  @media(max-width:420px){.jenis-wrap{grid-template-columns:1fr;justify-items:center}}
  .carta-bar{width:100%;height:auto;display:block}
  .kosong-carta{color:#94a3b8;font-size:13px;text-align:center;padding:30px 0}

  /* ---------- Senarai tuntutan ---------- */
  .cip{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
  .cip button{border:1px solid var(--garis);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--lembut)}
  .cip button.aktif{background:var(--utama);border-color:var(--utama);color:#fff}
  .tuntutan{border:1px solid var(--garis);border-radius:14px;padding:14px 16px;margin-top:12px;transition:box-shadow .15s}
  .tuntutan:hover{box-shadow:0 4px 14px rgba(16,24,40,.06)}
  .tuntutan-atas{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;cursor:pointer}
  .amaun{font-weight:800;font-size:16px;text-align:right}
  .lencana{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;vertical-align:middle;margin-left:4px}
  .s-proses{background:var(--amber-cair);color:var(--amber)} .s-lulus{background:var(--biru-cair);color:var(--biru)}
  .s-bayar{background:var(--hijau-cair);color:var(--hijau)} .s-tolak{background:var(--merah-cair);color:var(--merah)}

  .jejak{display:flex;margin:16px 0 4px}
  .langkah{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--lembut);line-height:1.3;padding:0 2px}
  .langkah::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--garis);z-index:0}
  .langkah:first-child::before{display:none}
  .langkah.siap::before,.langkah.semasa::before,.langkah.tolak::before{background:var(--utama)}
  .bulat{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#fff;border:3px solid var(--garis);position:relative;z-index:1;font-weight:700;font-size:13px}
  .siap .bulat{background:var(--utama);border-color:var(--utama);color:#fff}
  .semasa .bulat{border-color:var(--amber-terang);color:var(--amber);animation:denyut 1.6s infinite}
  .semasa{color:var(--amber);font-weight:700}
  .tolak .bulat{background:var(--merah);border-color:var(--merah);color:#fff} .tolak{color:var(--merah);font-weight:700}
  .siap{color:var(--teks)}
  @keyframes denyut{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}

  .butiran{display:none;border-top:1px dashed var(--garis);margin-top:12px;padding-top:12px;font-size:14px}
  .tuntutan.buka .butiran{display:block}
  .sejarah{list-style:none;margin:10px 0 0;padding:0}
  .sejarah li{padding:6px 0 6px 14px;border-left:2px solid var(--garis);position:relative}
  .sejarah li::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--utama)}
  dl.info{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:14px}
  dl.info dt{color:var(--lembut)} dl.info dd{margin:0;font-weight:600}
  @media(max-width:500px){dl.info{grid-template-columns:1fr} dl.info dd{margin-bottom:6px}}
  .amaran{background:var(--amber-cair);color:#7c4a03;padding:10px 12px;border-radius:11px;font-size:14px;margin-top:12px}
  .amaran.merah{background:var(--merah-cair);color:var(--merah)}
  .kosong{text-align:center;color:var(--lembut);padding:30px 0}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  @media(max-width:600px){.statgrid{grid-template-columns:1fr 1fr}}
  .statgrid .s{background:var(--bg);border-radius:11px;padding:10px 12px}
  .statgrid .s b{display:block;font-size:16px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14211f;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  #toast.tunjuk{opacity:1} #toast.ralat{background:var(--merah)}
  .memuat{display:grid;place-items:center;padding:80px 0;color:var(--lembut)}
  .pusing{width:34px;height:34px;border:3px solid var(--utama-cair);border-top-color:var(--utama);border-radius:50%;animation:pusing .8s linear infinite;margin-bottom:10px}
  @keyframes pusing{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="bar">
  <div class="jenama">
    <div class="logo logo-kecil" id="logoBar"></div>
    <div><b id="namaSistem"></b><small id="namaOrg"></small></div>
  </div>
  <div class="bar-aksi" id="barAksi" hidden>
    <button class="ikon-btn" onclick="viewTukarKL(false)" title="Tukar kata laluan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4M18 5l2 2M15 8l2 2"/></svg><span>Kata Laluan</span></button>
    <button class="ikon-btn" onclick="keluar()" title="Log keluar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Log Keluar</span></button>
  </div>
</header>
<main id="app"><div class="memuat"><div class="pusing"></div>Memuatkan…</div></main>
<div id="toast"></div>

<script>
/* ======================= TETAPAN ======================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxHdHemzO2WkGRBhZ-N4-OpsfL7Zn9gcMylqyYUI57j-SCZvauxPL1J91UalWiO_9oW/exec';   // URL Web App Apps Script (/exec)
const NAMA_SISTEM = 'Sistem Rekod Perubatan';
const NAMA_ORGANISASI = 'Korporasi Kemajuan Perikanan Dan Nelayan Sabah';                      // cth: 'Koperasi Nelayan ...' (kosongkan jika tiada)
const LOGO = 'logo.png';                         // fail logo dalam repo GitHub (PNG, latar lutsinar lebih cantik)
const MINIT_TAMAT = 15;                          // auto log keluar jika tiada aktiviti

const WARNA_JENIS = ['#0f766e','#0ea5e9','#8b5cf6','#f59e0b','#ec4899','#10b981','#64748b'];
const BULAN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];

const app = document.getElementById('app');
let token = null;       // token sesi dari server
let data = null;        // data papan pemuka
let tapis = 'SEMUA';    // penapis senarai tuntutan
let klSementara = null; // kata laluan log masuk (dalam memori sahaja) untuk tukar kali pertama

/* ======================= UTIL ======================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => 'RM' + Number(n || 0).toLocaleString('ms-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
const rmRingkas = n => { n = Number(n||0); return n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(Math.round(n)); };
const tarikhMY = s => { if(!s) return '-'; const [y,m,d] = s.slice(0,10).split('-'); return `${d}/${m}/${y}` + (s.length > 10 ? ' ' + s.slice(11) : ''); };
const inisial = n => String(n||'').replace(/\b(bin|binti|bt|b\.|a\/l|a\/p)\b/gi,'').trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();
function toast(msg, ralat){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'tunjuk' + (ralat ? ' ralat' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 4500); }
function logoHTML(kelas){ return `<div class="logo ${kelas}"><img src="${LOGO}" alt="" onerror="this.parentNode.classList.add('tiada');this.remove()"></div>`; }

document.getElementById('logoBar').outerHTML = logoHTML('logo-kecil');
document.getElementById('namaSistem').textContent = Sistem Rekod Perubatan;
document.getElementById('namaOrg').textContent = Korporasi Kemajuan Perikanan Dan Nelayan Sabah;

/* ---------- Sesi: sessionStorage (hilang bila tab/app ditutup) + auto keluar ---------- */
function simpanToken(t){
  try {
    if (t) { sessionStorage.setItem('stp_token', t); tandaAktif(); }
    else sessionStorage.removeItem('stp_token');
    localStorage.removeItem('stp_sesi');           // buang sesi versi lama
  } catch(e){}
}
function bacaToken(){
  try {
    const t = sessionStorage.getItem('stp_token');
    const akhir = Number(sessionStorage.getItem('stp_aktif') || 0);
    if (t && Date.now() - akhir > MINIT_TAMAT * 60000) { sessionStorage.removeItem('stp_token'); return null; }
    return t;
  } catch(e){ return null; }
}
let _aktif = Date.now();
function tandaAktif(){ _aktif = Date.now(); try { sessionStorage.setItem('stp_aktif', String(_aktif)); } catch(e){} }
['click','keydown','touchstart','scroll'].forEach(ev => addEventListener(ev, () => { if (token) tandaAktif(); }, {passive:true}));
function semakTamat(){
  if (token && Date.now() - _aktif > MINIT_TAMAT * 60000) {
    keluar();
    toast('Sesi tamat kerana tiada aktiviti selama ' + MINIT_TAMAT + ' minit.', true);
  }
}
setInterval(semakTamat, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) semakTamat(); });

async function api(action, payload){
  const body = Object.assign({action}, payload);
  if (token && !body.token && action !== 'semakTindakan' && action !== 'putuskan') body.token = token;
  let j;
  try {
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(body) });
    j = await res.json();
  } catch(e){ throw new Error('Tiada sambungan ke pelayan. Semak internet anda.'); }
  if (!j.ok) {
    if (j.kod === 'SESI_TAMAT' && action !== 'login') { keluar(true); }
    throw new Error(j.mesej || 'Ralat tidak diketahui');
  }
  return j;
}

function lencana(status){
  const k = {'DALAM PROSES':'s-proses','DILULUSKAN':'s-lulus','DIBAYAR':'s-bayar','DITOLAK':'s-tolak'}[status] || 's-proses';
  const label = {'DILULUSKAN':'DILULUSKAN – MENUNGGU BAYARAN'}[status] || status;
  return `<span class="lencana ${k}">${esc(label)}</span>`;
}

function penjejak(c, namaPeringkat){
  const langkah = ['Dihantar'].concat(namaPeringkat);
  return '<div class="jejak">' + langkah.map((nama, i) => {
    let kelas = '', ikon = i + 1;
    if (i === 0 || c.peringkat >= i) { kelas = 'siap'; ikon = '✓'; }
    else if (i === c.peringkat + 1) {
      if (c.status === 'DITOLAK') { kelas = 'tolak'; ikon = '✕'; }
      else kelas = 'semasa';
    }
    return `<div class="langkah ${kelas}"><div class="bulat">${ikon}</div>${esc(nama)}</div>`;
  }).join('') + '</div>';
}

function senaraiSejarah(sej){
  return '<ul class="sejarah">' + (sej || []).map(h =>
    `<li><b>${esc(h.tindakan)}</b> — ${esc(h.peringkat)}<br>
     <span class="kecil">${tarikhMY(h.masa)} · ${esc(h.oleh)}</span>
     ${h.catatan ? `<br><span class="kecil">“${esc(h.catatan)}”</span>` : ''}</li>`).join('') + '</ul>';
}

/* ======================= CARTA (SVG) ======================= */
// Carta donut/pai. segmen: [{nilai, warna, label}]
function cartaDonut(segmen, tebal){
  const S = 200, r = (S - tebal) / 2, lilitan = 2 * Math.PI * r;
  const jumlah = segmen.reduce((a, s) => a + Math.max(0, s.nilai), 0);
  const ada = segmen.filter(s => s.nilai > 0);
  const jarak = ada.length > 1 ? 2 : 0;
  let offset = 0, arka = '';
  if (jumlah > 0) ada.forEach(s => {
    const p = s.nilai / jumlah * lilitan;
    arka += `<circle class="lengkung" cx="${S/2}" cy="${S/2}" r="${r}" fill="none" stroke="${s.warna}" stroke-width="${tebal}"
      stroke-dasharray="${Math.max(0, p - jarak)} ${lilitan}" stroke-dashoffset="${-offset}"><title>${esc(s.label)}: ${rm(s.nilai)}</title></circle>`;
    offset += p;
  });
  return `<svg viewBox="0 0 ${S} ${S}" role="img"><g transform="rotate(-90 ${S/2} ${S/2})">
    <circle cx="${S/2}" cy="${S/2}" r="${r}" fill="none" stroke="#edf2f1" stroke-width="${tebal}"/>${arka}</g></svg>`;
}

// Carta bar bulanan
function cartaBar(nilai, tahun){
  const W = 360, H = 200, kiri = 6, bawah = 26, atas = 22;
  const lebar = (W - kiri * 2) / 12, tinggi = H - bawah - atas, max = Math.max(...nilai, 0);
  const sekarang = new Date(), bulanIni = String(sekarang.getFullYear()) === String(tahun) ? sekarang.getMonth() : -1;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="carta-bar" role="img" aria-label="Tuntutan bulanan">`;
  for (let i = 0; i <= 3; i++) { const y = atas + tinggi * i / 3; s += `<line x1="${kiri}" x2="${W-kiri}" y1="${y}" y2="${y}" stroke="#eef2f1"/>`; }
  nilai.forEach((v, i) => {
    const h = max > 0 ? v / max * tinggi : 0, w = lebar * 0.58, x = kiri + i * lebar + (lebar - w) / 2, y = atas + tinggi - h;
    if (v > 0) {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 3)}" rx="5" fill="${i === bulanIni ? '#0f766e' : '#7cc4b8'}"><title>${BULAN[i]}: ${rm(v)}</title></rect>`;
      s += `<text x="${x + w/2}" y="${y - 6}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">${rmRingkas(v)}</text>`;
    }
    s += `<text x="${x + w/2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="${i === bulanIni ? '#0f766e' : '#64748b'}" font-weight="${i === bulanIni ? 700 : 500}">${BULAN[i]}</text>`;
  });
  if (max === 0) s += `<text x="${W/2}" y="${atas + tinggi/2}" text-anchor="middle" font-size="12" fill="#94a3b8">Tiada tuntutan untuk tahun ini</text>`;
  return s + '</svg>';
}

// Gambar dikecilkan (maks 1600px, JPEG) supaya foto kamera telefon tidak melebihi had; PDF dihantar seperti asal.
async function sediaResit(fail){
  const bacaURL = blob => new Promise((ok, gagal) => {
    const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = gagal; r.readAsDataURL(blob);
  });
  if (/^image\/(jpeg|jpg|png|webp)$/i.test(fail.type)) {
    try {
      const src = URL.createObjectURL(fail);
      const img = await new Promise((ok, gagal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = gagal; i.src = src; });
      const skala = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * skala); cv.height = Math.round(img.naturalHeight * skala);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(src);
      return { nama: fail.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg',
               data: cv.toDataURL('image/jpeg', 0.82).split(',')[1] };
    } catch(e){ /* guna fail asal */ }
  }
  return { nama: fail.name, mimeType: fail.type || 'application/octet-stream', data: (await bacaURL(fail)).split(',')[1] };
}

  <div class="kad">
    <h2>Keputusan</h2>
    <form id="fKeputusan">
      <label>Nama anda</label><input name="oleh" required>
      ${isKA ? `<label>Amaun diluluskan (RM)</label>
        <input type="number" name="amaunLulus" step="0.01" min="0.01" max="${Math.min(c.amaun, b.baki)}" value="${Math.min(c.amaun, b.baki).toFixed(2)}" required>` : ''}
      <label>Catatan ${isBayar ? '(cth: no. baucar / tarikh bayaran)' : ''} <span class="kecil">— wajib jika tolak</span></label>
      <textarea name="catatan" rows="3"></textarea>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button type="button" class="btn btn-utama" data-k="LULUS">${isBayar ? '✓ Sahkan Telah Dibayar' : '✓ Lulus'}</button>
        <button type="button" class="btn btn-merah" data-k="TOLAK">✕ Tolak</button>
      </div>
    </form>
  </div>`;
  const f = document.getElementById('fKeputusan');
  f.querySelectorAll('button[data-k]').forEach(btn => btn.onclick = async () => {
    const k = btn.dataset.k;
    if (!f.oleh.value.trim()) return toast('Sila isi nama anda.', true);
    if (k === 'TOLAK' && !f.catatan.value.trim()) return toast('Sila nyatakan sebab penolakan.', true);
    if (!confirm(k === 'TOLAK' ? 'Tolak tuntutan ini?' : 'Sahkan keputusan?')) return;
    f.querySelectorAll('button').forEach(x => x.disabled = true);
    try {
      const r = await api('putuskan', { id, token: t, keputusan: k, oleh: f.oleh.value,
        catatan: f.catatan.value, amaunLulus: f.amaunLulus ? f.amaunLulus.value : '' });
      app.innerHTML = `<div class="kad kosong"><h2>Terima kasih</h2><p>${esc(r.mesej)}</p><p class="kecil">Anda boleh tutup halaman ini.</p></div>`;
    } catch(err){ toast(err.message, true); f.querySelectorAll('button').forEach(x => x.disabled = false); }
  });
}

/* ======================= PWA & MULA ======================= */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

(async function mula(){
  const q = new URLSearchParams(location.search);
  if (q.get('tindakan')) return viewTindakan(q.get('tindakan'), q.get('t'));
  token = bacaToken();
  if (!token) return viewLogin();
  try { await muatDashboard(); } catch(err){ token = null; simpanToken(null); viewLogin(); }
})();
</script>
